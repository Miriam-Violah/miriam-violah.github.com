<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miriam Violah Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      background: #111;
      color: white;
      padding: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Miriam Violah’s Gumroad Gallery</h1>
  <div class="gallery">
    <a href="https://miriamviolah.gumroad.com/l/product1" target="_blank">
      <img src="https://via.placeholder.com/400x400?text=My+Art+1" alt="Art 1">
    </a>
    <a href="https://miriamviolah.gumroad.com/l/product2" target="_blank">
      <img src="https://via.placeholder.com/400x400?text=My+Art+2" alt="Art 2">
    </a>
  </div>
</body>
</html>
